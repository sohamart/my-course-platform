services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mycourse-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:5000:5000"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - mycourse-net

  caddy:
    image: caddy:2.9-alpine
    container_name: mycourse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - mycourse-net

networks:
  mycourse-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

